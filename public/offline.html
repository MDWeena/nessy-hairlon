<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — Nessy Hairlon</title>
    <meta name="theme-color" content="#1E1914" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0A0A0A;
        font-family: "DM Sans", system-ui, sans-serif;
        color: #EDEDED;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      .mark {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        border: 2px solid #C49A6C;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
      }
      .mark span {
        font-family: "Tangerine", cursive;
        font-weight: 700;
        font-size: 56px;
        color: #C49A6C;
      }
      h1 {
        font-family: "Tangerine", cursive;
        font-weight: 700;
        font-size: 44px;
        color: #C49A6C;
        margin: 0 0 12px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #B8B0A6;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"><span>N</span></div>
      <h1>Nessy Hairlon</h1>
      <p>You're currently offline. Please connect to the internet to book an appointment.</p>
    </div>
  </body>
</html>
